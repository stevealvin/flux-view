<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light Bright Background Gradient -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>

    <!-- Bar 1 Gradient (Electric Cyan to Royal Blue) -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Bar 2 Gradient (Royal Blue to Indigo to Violet) -->
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Bar 3 Gradient (Indigo to Violet to Pink) -->
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Light Border Highlight Gradient -->
    <linearGradient id="borderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(2, 132, 199, 0.25)"/>
      <stop offset="100%" stop-color="rgba(124, 58, 237, 0.25)"/>
    </linearGradient>

    <!-- Clean Drop Shadow for Light Mode -->
    <filter id="softLightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Light Superellipse Container Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgLight)" stroke="url(#borderLight)" stroke-width="3" filter="url(#softLightShadow)"/>

  <!-- Left Scattered Dots + Ultra-Minimalist Right Parallel Stream Bars -->
  <g transform="translate(0, 0)">
    <!-- RIGHT SIDE: 3 Ultra-Clean Solid Stream Bars -->
    <!-- Bar 1 (Top Stream Bar) -->
    <rect x="240" y="150" width="180" height="28" rx="14" fill="url(#barGrad1)"/>

    <!-- Bar 2 (Middle Stream Bar - Offset/Longer) -->
    <rect x="220" y="242" width="210" height="28" rx="14" fill="url(#barGrad2)"/>

    <!-- Bar 3 (Bottom Stream Bar) -->
    <rect x="250" y="334" width="170" height="28" rx="14" fill="url(#barGrad3)"/>

    <!-- LEFT SIDE: Scattered Dots of Varying Sizes and Bright Colors -->
    <!-- Dot 1: Large Sky Cyan -->
    <circle cx="130" cy="155" r="18" fill="#38BDF8"/>
    
    <!-- Dot 2: Medium Royal Blue -->
    <circle cx="180" cy="205" r="11" fill="#2563EB"/>
    
    <!-- Dot 3: Extra Large Violet -->
    <circle cx="110" cy="265" r="22" fill="#8B5CF6"/>
    
    <!-- Dot 4: Medium Rose Pink -->
    <circle cx="170" cy="325" r="14" fill="#EC4899"/>
    
    <!-- Dot 5: Small Amber Gold -->
    <circle cx="120" cy="385" r="9" fill="#F59E0B"/>
    
    <!-- Dot 6: Medium Emerald Teal -->
    <circle cx="195" cy="395" r="15" fill="#10B981"/>
  </g>
</svg>